<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>OpenChat — Messages</title><style>
:root{--green:#075e54;--mint:#d9fdd3;--bg:#efeae2;--ink:#182229;--muted:#667781;--line:#e9edef}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #0001}.top{background:var(--green);color:white;padding:14px 16px;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;font-size:23px}.brand{font-size:19px;font-weight:750}.sub{font-size:12px;opacity:.8}.tabs{display:flex;background:var(--green);color:#d3e6e3}.tab{flex:1;padding:12px 4px;border:0;background:transparent;color:inherit;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:white;border-color:#9be7c4}.notice{padding:8px 12px;background:#fff3cd;color:#66551a;font-size:12px;text-align:center}.layout{display:flex;flex:1;min-height:0}.sidebar{width:38%;max-width:310px;border-right:1px solid var(--line);overflow:auto}.search{padding:10px;background:#fff}.search input{width:100%;border:0;border-radius:10px;background:#f0f2f5;padding:11px 13px;outline:none}.contact{display:flex;gap:11px;align-items:center;padding:13px 12px;border-bottom:1px solid #f3f5f6;cursor:pointer}.contact.active,.contact:hover{background:#f0f2f5}.avatar{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#d9fdd3;font-size:21px}.cinfo{min-width:0;flex:1}.cname{font-weight:650}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chat{display:flex;flex:1;min-width:0;flex-direction:column;background-color:#efeae2;background-image:radial-gradient(#d7cfc2 0.6px,transparent .6px);background-size:15px 15px}.chathead{background:#f7f8f8;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.chathead .name{font-weight:700}.chathead .sub{color:var(--muted);opacity:1}.messages{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:84%;padding:9px 10px 6px;border-radius:10px;background:#fff;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere;align-self:flex-start}.bubble.mine{align-self:flex-end;background:var(--mint)}.time{display:block;text-align:right;font-size:10px;color:#667781;margin-top:4px}.empty{margin:auto;background:#fff9;border-radius:12px;padding:16px;text-align:center;color:#53646b;font-size:13px}.composer{display:flex;gap:8px;align-items:center;padding:10px;background:#f0f2f5}.composer input{flex:1;min-width:0;border:0;border-radius:24px;background:#fff;padding:13px 15px;outline:none}.send{width:45px;height:45px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:20px}.footer{text-align:center;font-size:11px;color:var(--muted);padding:6px}.hidden{display:none!important}@media(max-width:600px){.app{height:100dvh}.sidebar{width:100%;max-width:none;border:0}.chat{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .chat{display:flex}.back{border:0;background:transparent;font-size:22px;margin-right:2px}.notice{font-size:11px}.contact{padding:12px}.top{padding:11px 14px}}@media(min-width:601px){.back{display:none}}
</style></head><body><main class="app"><header class="top"><div class="logo">✉</div><div><div class="brand">OpenChat</div><div class="sub">Simple messaging · Android-friendly</div></div></header><nav class="tabs"><button class="tab active" data-tab="chats">CHATS</button><button class="tab" data-tab="status">STATUS</button><button class="tab" data-tab="calls">CALLS</button></nav><div class="notice">Prototype: messages are saved only on this device. No real messages are sent yet.</div><div class="layout" id="layout"><aside class="sidebar"><div class="search"><input id="search" placeholder="Search chats" aria-label="Search chats"></div><div id="contacts"></div></aside><section class="chat"><header class="chathead"><button class="back" id="back" aria-label="Back to chats">‹</button><div class="avatar" id="headAvatar">👋</div><div><div class="name" id="headName">Choose a chat</div><div class="sub" id="headSub">Local demo conversation</div></div></header><div class="messages" id="messages"><div class="empty">Choose a contact to start a demo conversation.</div></div><form class="composer" id="composer"><input id="draft" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button class="send" aria-label="Send message">➤</button></form></section></div><div class="footer">OpenChat prototype · Not affiliated with WhatsApp</div></main><script>
const seed=[{id:'a',name:'Amina',avatar:'👩🏽',preview:'Hey! How are you?',messages:[{from:'them',text:'Hey! How are you?',time:Date.now()-3600000}]},{id:'b',name:'Brian',avatar:'🧑🏾',preview:'See you tomorrow',messages:[{from:'them',text:'See you tomorrow',time:Date.now()-7200000}]},{id:'c',name:'Family group',avatar:'👨‍👩‍👧‍👦',preview:'Mum: Good morning everyone',messages:[{from:'them',text:'Mum: Good morning everyone',time:Date.now()-86400000}]},{id:'d',name:'Sarah',avatar:'👩🏿',preview:'Sent a photo',messages:[{from:'them',text:'Sent a photo',time:Date.now()-172800000}]}];
let chats;try{chats=JSON.parse(localStorage.getItem('openchat-demo-chats-v1'))||seed}catch(e){chats=seed}let selected=null;const $=id=>document.getElementById(id);const stamp=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});function save(){try{localStorage.setItem('openchat-demo-chats-v1',JSON.stringify(chats))}catch(e){}}
function drawContacts(){const q=$('search').value.toLowerCase();$('contacts').innerHTML='';chats.filter(c=>c.name.toLowerCase().includes(q)||c.preview.toLowerCase().includes(q)).forEach(c=>{const el=document.createElement('div');el.className='contact'+(selected===c.id?' active':'');el.innerHTML='<div class="avatar">'+c.avatar+'</div><div class="cinfo"><div class="cname"></div><div class="preview"></div></div>';el.querySelector('.cname').textContent=c.name;el.querySelector('.preview').textContent=c.preview;el.onclick=()=>openChat(c.id);$('contacts').append(el)})}
function openChat(id){selected=id;const c=chats.find(x=>x.id===id);$('headName').textContent=c.name;$('headAvatar').textContent=c.avatar;$('headSub').textContent='Demo chat · local only';$('messages').innerHTML='';if(!c.messages.length){const e=document.createElement('div');e.className='empty';e.textContent='No messages yet. Say hello!';$('messages').append(e)}c.messages.forEach(m=>{const b=document.createElement('div');b.className='bubble'+(m.from==='me'?' mine':'');const txt=document.createElement('div');txt.textContent=m.text;const time=document.createElement('span');time.className='time';time.textContent=stamp(m.time);b.append(txt,time);$('messages').append(b)});$('messages').scrollTop=$('messages').scrollHeight;drawContacts();$('layout').classList.add('chat-open');$('draft').focus()}
$('back').onclick=()=>$('layout').classList.remove('chat-open');$('search').oninput=drawContacts;
$('composer').onsubmit=e=>{e.preventDefault();const text=$('draft').value.trim();if(!text||!selected)return;const c=chats.find(x=>x.id===selected);c.messages.push({from:'me',text,time:Date.now()});c.preview='You: '+text;$('draft').value='';save();openChat(selected)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab!=='chats'){alert(b.dataset.tab==='status'?'Status feature is planned, not implemented yet.':'Internet calling is planned, not implemented yet.')}});
drawContacts();if(chats.length)openChat(chats[0].id);
</script></body></html>
