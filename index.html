<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIABLOOON 6 MIN</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;padding:12px}.header{background:linear-gradient(135deg,#ff6a00,#ff3c00);padding:18px;border-radius:16px;text-align:center}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin:12px 0}textarea{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;min-height:70px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;margin-top:8px}.btn-orange{background:linear-gradient(135deg,#ff7a00,#ff3c00);color:#fff}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #3a3a3a}.scene{border:1px solid #333;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#111}.scene img{width:100%;height:200px;object-fit:cover;background:#222;display:block}.badge{background:#ff6a00;padding:2px 8px;border-radius:20px;font-size:10px}.bar{height:8px;background:#222;border-radius:10px;overflow:hidden}.barfill{height:100%;width:0%;background:#ff6a00}</style></head><body><div class="header"><h1>DIABLOOON 6-MINUTE EPIC 🔊</h1><p>6 MINUTES | 6 SCENES x 60s | VOICE + MUSIC</p></div><div class="card"><textarea id="idea">Diabolooon and the Lost Treasure - Epic 6 minute adventure</textarea><div style="display:flex;gap:6px"><button class="btn btn-dark" style="flex:1" onclick="toggleMusic()" id="musicBtn">🎵 Music ON</button><button class="btn btn-dark" style="flex:1" onclick="testVoice()">🎤 Test Voice</button></div><button class="btn btn-orange" id="genBtn" onclick="generateAll()">🎬 GENERATE 6-MIN MOVIE</button><div id="status" style="font-size:12px;color:#ff8a00;margin-top:6px">Ready - 6x60s = 6:00</div><div class="bar"><div class="barfill" id="bar"></div></div><audio id="bgMusic" loop crossorigin="anonymous" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=happy-day-101981.mp3"></audio></div><div id="scenes"></div><div class="card"><button class="btn btn-orange" onclick="playStory()">▶️ PLAY 6-MIN WITH VOICE</button><button class="btn btn-dark" onclick="downloadVideo()">⬇ DOWNLOAD 6-MIN VIDEO</button></div><script>const LOCKED="LOCKED SAME FACES: Diabolooon monkey RED cap, Bello elephant BLUE shirt, Luna rabbit PINK dress, Tico turtle GREEN glasses, Sky parrot YELLOW BLUE,";let generatedImages=[],videoBlobUrl=null,musicOn=true;const SCRIPTS=["Scene 1 Morning: Sun rises over jungle! Diabolooon wakes up in treehouse, red cap! Excited for treasure hunt with friends!","Scene 2 Problem: Oh no! Broken bridge over river! Treasure other side! How cross? Bello tries but wobbles! Must not give up!","Scene 3 Plan: Teamwork plan! Luna says vines! Tico draws in sand! Bello lift logs! Luna tie! Sky bring sticks! High-five!","Scene 4 Build: Work hard! Bello lifts log heave-ho! Luna ties tight! Tico measures! Diabolooon hammers tap tap! Almost there!","Scene 5 Cross: Ready! New bridge strong with flowers! Diabolooon first safe! Then Bello, Luna, Tico, Sky! See shiny behind bushes!","Scene 6 Treasure: Wow golden chest! Inside friendship bracelets! Note: Best treasure is friends who help! Celebrate dance hug! The end!"];function makePrompts(a){return[`${LOCKED} ${a} sunrise waking 3D Pixar`,`${LOCKED} ${a} broken bridge problem 3D Pixar`,`${LOCKED} ${a} teamwork planning 3D Pixar`,`${LOCKED} ${a} building bridge working 3D Pixar`,`${LOCKED} ${a} crossing bridge adventure 3D Pixar`,`${LOCKED} ${a} treasure celebration confetti 3D Pixar`]}function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'🎵 Music ON':'🔇 Music OFF';const el=document.getElementById('bgMusic');if(musicOn)el.play().catch(()=>{});else el.pause();}function testVoice(){speak("Hello! Six minute epic adventure ready?")}function speak(t){return new Promise(r=>{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=0.85;u.onend=r;u.onerror=r;window.speechSynthesis.speak(u);setTimeout(r,t.length*65+2000);});}async function generateAll(){const idea=document.getElementById('idea').value;const prompts=makePrompts(idea);document.getElementById('scenes').innerHTML='';generatedImages=[];document.getElementById('genBtn').disabled=true;for(let i=0;i<prompts.length;i++){const p=prompts[i];const div=document.createElement('div');div.className='scene';div.innerHTML=`<div style="padding:8px"><span class="badge">SCENE ${i+1} - 60s</span></div><img id="img${i}"><div id="meta${i}" style="padding:8px;font-size:12px">⏳</div>`;document.getElementById('scenes').appendChild(div);if(i>0){for(let w=50;w>=0;w--){document.getElementById(`meta${i}`).textContent=`⏳ Waiting ${w}s FREE...`;await new Promise(r=>setTimeout(r,1000));}}const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1280&height=720&seed=${100+i*23}&nologo=true`;document.getElementById(`img${i}`).src=url;await new Promise(r=>{const im=document.getElementById(`img${i}`);im.onload=r;im.onerror=r;setTimeout(r,15000);});document.getElementById(`meta${i}`).textContent=`✅ Scene ${i+1} Done`;generatedImages[i]=document.getElementById(`img${i}`).src;document.getElementById('bar').style.width=((i+1)/6*100)+'%';}document.getElementById('status').textContent='✅ All 6 ready! Building 6-min video...';document.getElementById('genBtn').disabled=false;buildVideoWithAudio();}async function playStory(){for(let i=0;i<SCRIPTS.length;i++){document.getElementById('status').textContent=`🔊 Scene ${i+1}/6`;await speak(SCRIPTS[i]);}}async function buildVideoWithAudio(){const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');const canvasStream=canvas.captureStream(24);const audioCtx=new (window.AudioContext||window.webkitAudioContext)();const dest=audioCtx.createMediaStreamDestination();const musicEl=document.getElementById('bgMusic');try{const src=audioCtx.createMediaElementSource(musicEl);src.connect(dest);src.connect(audioCtx.destination);musicEl.play().catch(()=>{});}catch{}const combined=new MediaStream([...canvasStream.getVideoTracks(),...dest.stream.getAudioTracks()]);const rec=new MediaRecorder(combined,{mimeType:'video/webm'});let ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{const blob=new Blob(ch,{type:'video/webm'});videoBlobUrl=URL.createObjectURL(blob);document.getElementById('status').textContent='✅ 6-MINUTE READY!';};rec.start();for(let idx=0;idx<generatedImages.length;idx++){const img=new Image();img.crossOrigin='anonymous';img.src=generatedImages[idx];await new Promise(r=>{img.onload=r;img.onerror=r;setTimeout(r,1500);});for(let f=0;f<1440;f++){ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,canvas.height-70,canvas.width,70);ctx.fillStyle='white';ctx.font='bold 16px sans-serif';ctx.fillText(SCRIPTS[idx].slice(0,75),10,canvas.height-25);await new Promise(r=>setTimeout(r,1000/24));}}rec.stop();}function downloadVideo(){if(!videoBlobUrl){alert('Wait building 6-min...');return}const a=document.createElement('a');a.href=videoBlobUrl;a.download='DIABLOOON-6MIN.webm';a.click();}</script></body></html>
