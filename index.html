<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIABLOOON STUDIO</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f12;color:#fff;padding:14px}
h1{text-align:center;margin:10px;font-size:20px}
.card{background:#1c1c20;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #2a2a30}
.btn{width:100%;background:#FF6B35;border:none;border-radius:12px;padding:13px;font-weight:800;color:#000;margin-top:10px}
input,select,textarea{width:100%;background:#0f0f12;border:1px solid #333;border-radius:10px;padding:11px;color:#fff;margin-top:6px}
textarea{height:90px}.tag{background:#25252b;padding:8px;border-radius:8px;font-size:12px;margin-top:8px;white-space:pre-wrap}.preview{width:100%;border-radius:12px;margin-top:10px;display:none}
</style></head><body>
<h1>🐵 DIABLOOON STUDIO</h1>
<p style="text-align:center;color:#aaa;font-size:12px">Faceless Kids Video Factory - Locked Characters</p>
<div class="card"><h3>🔒 STEP 1 - Lock Characters</h3>
<input type="file" id="charImg" accept="image/*"><img id="charPreview" class="preview">
<div class="tag" id="lockPrompt">Upload original image to generate lock prompt. This keeps faces SAME forever.</div></div>
<div class="card"><h3>📝 STEP 2 - Story</h3>
<select id="topic"><option>Diablooon Learns to Share</option><option>Diablooon and the Lost Treasure</option><option>Diablooon Learns Colors</option><option>Diablooon Counts to 10</option><option>Diablooon Helps Friends</option></select>
<button class="btn" onclick="genStory()">Generate Story + Prompts</button><textarea id="storyOut"></textarea></div>
<div class="card"><h3>🎬 STEP 3 - Sora Prompts</h3><div id="soraPrompts"></div><button class="btn" onclick="copyPrompts()">Copy Prompts</button></div>
<div class="card"><h3>📤 STEP 4 - YouTube</h3><input id="ytTitle" placeholder="Title"><textarea id="ytDesc" placeholder="Description"></textarea>
<button class="btn" onclick="alert('Now: Generate video in Sora with prompts + original image, download as video.mp4, upload video.mp4 + thumbnail.jpg to GitHub root, then run Actions workflow!')">How to Upload</button></div>
<script>
const LOCKED=`LOCKED CHARACTERS - NEVER CHANGE FACES: Diablooon monkey RED cap, Bello elephant BLUE shirt, Luna rabbit PINK dress, Tico turtle GREEN glasses, Sky parrot YELLOW BLUE - SAME face every scene, 3D Pixar cartoon bright`;
document.getElementById('charImg').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=document.getElementById('charPreview');img.src=ev.target.result;img.style.display='block';document.getElementById('lockPrompt').innerText=LOCKED+' Use original image as reference!';};r.readAsDataURL(f);});
function genStory(){const t=document.getElementById('topic').value;const s=`Title: ${t} - Scene1 wake, Scene2 problem bridge, Scene3 plan, Scene4 teamwork fix, Scene5 celebration. Moral: ${t}`;document.getElementById('storyOut').value=s;const p=[`Morning jungle ${LOCKED} sunrise`,`Broken bridge ${LOCKED} worried`,`Planning ${LOCKED} teamwork close up`,`Fixing ${LOCKED} working`,`Celebration ${LOCKED} confetti`];let h='';p.forEach((x,i)=>{h+=`<div class=tag><b>Prompt ${i+1}:</b> ${x}</div>`});document.getElementById('soraPrompts').innerHTML=h;window.soraList=p;document.getElementById('ytTitle').value=`${t} | DIABLOOON & Friends`;document.getElementById('ytDesc').value=s+' #Diablooon';}
function copyPrompts(){if(!window.soraList)return alert('Generate first');navigator.clipboard.writeText(window.soraList.join('\n\n')).then(()=>alert('Copied! Paste in Sora with original image'));}
</script></body></html>
