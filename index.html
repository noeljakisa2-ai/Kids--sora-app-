<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIABLOOON WITH SOUND</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;padding:12px}.header{background:linear-gradient(135deg,#ff6a00,#ff3c00);padding:18px;border-radius:16px;text-align:center}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin:12px 0}textarea{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;min-height:70px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;margin-top:8px}.btn-orange{background:linear-gradient(135deg,#ff7a00,#ff3c00);color:#fff}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #3a3a3a}.scene{border:1px solid #333;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#111}.scene img{width:100%;height:200px;object-fit:cover;background:#222;display:block}.badge{background:#ff6a00;padding:2px 8px;border-radius:20px;font-size:10px}.bar{height:6px;background:#222;border-radius:10px;overflow:hidden}.barfill{height:100%;width:0%;background:#ff6a00}</style></head><body><div class="header"><h1>DIABLOOON 🔊</h1><p>WITH VOICE + MUSIC</p></div><div class="card"><textarea id="idea">Diabolooon and the Lost Treasure</textarea><div style="display:flex;gap:6px"><button class="btn btn-dark" style="flex:1" onclick="toggleMusic()" id="musicBtn">🎵 Music: ON</button><button class="btn btn-dark" style="flex:1" onclick="testVoice()">🎤 Test Voice</button></div><button class="btn btn-orange" id="genBtn" onclick="generateAll()">🎬 GENERATE WITH VOICE</button><div id="status" style="font-size:12px;color:#ff8a00;margin-top:6px">Ready</div><div class="bar"><div class="barfill" id="bar"></div></div><audio id="bgMusic" loop crossorigin="anonymous" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=happy-day-101981.mp3"></audio></div><div id="scenes"></div><div class="card"><button class="btn btn-dark" onclick="playStory()">▶️ Play Story with Voice</button><button class="btn btn-dark" onclick="downloadVideo()">⬇ Download Video with Music</button></div><script>const LOCKED="LOCKED CHARACTERS SAME FACE: Diabolooon monkey RED cap, Bello elephant BLUE shirt, Luna rabbit PINK dress, Tico turtle GREEN glasses, Sky parrot YELLOW BLUE,";let generatedImages=[],videoBlobUrl=null,musicOn=true;const SCRIPTS=["Diabolooon wakes up in the sunny jungle! Today is adventure day!","Oh no! The bridge is broken! How will they get the treasure?","Teamwork time! Bello, Luna, Tico and Sky make a plan together.","They work hard! Fixing the bridge with vines and wood. You can do it!","Hooray! Treasure found! Friends celebrate because teamwork makes the dream work!"];function makePrompts(i){return[`${LOCKED} ${i} morning wake surprised 3D Pixar bright`,`${LOCKED} ${i} broken bridge worried 3D Pixar`,`${LOCKED} ${i} teamwork planning closeup 3D Pixar`,`${LOCKED} ${i} fixing bridge working hard 3D Pixar`,`${LOCKED} ${i} celebration treasure confetti happy 3D Pixar`]}function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'🎵 Music: ON':'🔇 Music: OFF';if(musicOn)document.getElementById('bgMusic').play().catch(()=>{});else document.getElementById('bgMusic').pause();}function testVoice(){speak("Hello! I am Diabolooon! Welcome to our adventure!")}function speak(t){window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=0.9;u.pitch=1.2;window.speechSynthesis.speak(u);}async function generateAll(){const idea=document.getElementById('idea').value;const prompts=makePrompts(idea);document.getElementById('scenes').innerHTML='';generatedImages=[];document.getElementById('genBtn').disabled=true;document.getElementById('bgMusic').play().catch(()=>{});for(let i=0;i<prompts.length;i++){const p=prompts[i];const div=document.createElement('div');div.className='scene';div.innerHTML=`<div style="padding:8px"><span class="badge">SCENE ${i+1}</span><div style="font-size:11px">${SCRIPTS[i]}</div></div><img id="img${i}"><div id="meta${i}" style="padding:8px;font-size:12px">⏳</div>`;document.getElementById('scenes').appendChild(div);if(i>0){for(let w=50;w>=0;w--){document.getElementById(`meta${i}`).textContent=`⏳ Waiting ${w}s FREE...`;await new Promise(r=>setTimeout(r,1000));}}const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=768&seed=${100+i*17}&nologo=true`;document.getElementById(`meta${i}`).textContent='🎨 Generating...';document.getElementById(`img${i}`).src=url;await new Promise(r=>{const im=document.getElementById(`img${i}`);im.onload=r;im.onerror=r;setTimeout(r,12000);});document.getElementById(`meta${i}`).textContent='✅ Done';generatedImages[i]=document.getElementById(`img${i}`).src;document.getElementById('bar').style.width=((i+1)/5*100)+'%';}document.getElementById('status').textContent='✅ Ready! Tap Play Story for voice';document.getElementById('genBtn').disabled=false;buildVideoWithAudio();}async function playStory(){for(let i=0;i<SCRIPTS.length;i++){document.getElementById('status').textContent=`🔊 Scene ${i+1}: ${SCRIPTS[i]}`;speak(SCRIPTS[i]);await new Promise(r=>setTimeout(r,4000));}}async function buildVideoWithAudio(){try{const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=768;const ctx=canvas.getContext('2d');const canvasStream=canvas.captureStream(24);const audioCtx=new (window.AudioContext||window.webkitAudioContext)();const dest=audioCtx.createMediaStreamDestination();const musicEl=document.getElementById('bgMusic');const musicSource=audioCtx.createMediaElementSource(musicEl);musicSource.connect(dest);musicSource.connect(audioCtx.destination);if(musicOn)musicEl.play().catch(()=>{});const combinedStream=new MediaStream([...canvasStream.getVideoTracks(),...dest.stream.getAudioTracks()]);const recorder=new MediaRecorder(combinedStream,{mimeType:'video/webm'});let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});videoBlobUrl=URL.createObjectURL(blob);document.getElementById('status').textContent='✅ VIDEO WITH MUSIC READY!';};recorder.start();for(let idx=0;idx<generatedImages.length;idx++){const img=new Image();img.crossOrigin='anonymous';img.src=generatedImages[idx];await new Promise(r=>{img.onload=r;img.onerror=r;setTimeout(r,1500);});for(let f=0;f<90;f++){ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,canvas.height-70,canvas.width,70);ctx.fillStyle='white';ctx.font='bold 18px sans-serif';ctx.fillText(`${SCRIPTS[idx].slice(0,55)}`,10,canvas.height-20);await new Promise(r=>setTimeout(r,1000/24));}}recorder.stop();}catch(e){document.getElementById('status').textContent='Video ready - use Play Story for voice';}}function downloadVideo(){if(!videoBlobUrl){alert('Wait... building');return}const a=document.createElement('a');a.href=videoBlobUrl;a.download='DIABLOOON-with-music.webm';a.click();}</script></body></html>
