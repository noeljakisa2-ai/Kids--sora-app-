<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIABLOOON Studio FREE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;padding:12px}.header{background:linear-gradient(135deg,#ff6a00,#ff3c00);padding:18px;border-radius:16px;text-align:center;margin-bottom:14px}.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:12px}input,textarea,select{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px}textarea{min-height:70px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}.btn-orange{background:linear-gradient(135deg,#ff7a00,#ff3c00);color:#fff}.btn-dark{background:#2a2a2a;color:#fff;border:1px solid #3a3a3a}.scene{border:1px solid #333;border-radius:12px;overflow:hidden;margin-bottom:10px;background:#111}.scene img{width:100%;height:220px;object-fit:cover;background:#222}.badge{background:#ff6a00;padding:2px 8px;border-radius:20px;font-size:10px}.progress{height:6px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0%;background:#ff6a00}</style></head><body><div class="header"><h1>DIABLOOON STUDIO</h1><p>FREE - Generate Video Inside App</p></div><div class="card"><textarea id="idea">Diabolooon and the Lost Treasure - monkey wants to cross broken bridge to find treasure with friends</textarea><button class="btn btn-orange" id="genBtn" onclick="generateAll()">🎬 GENERATE 5 SCENES + VIDEO</button><div id="status" style="font-size:12px;color:#ff8a00;margin-top:6px">Ready - FREE Pollinations AI</div><div class="progress"><div class="bar" id="bar"></div></div></div><div id="scenes"></div><div class="card"><button class="btn btn-dark" onclick="downloadVideo()">⬇ Download Video</button><button class="btn btn-dark" onclick="copyAll()">📋 Copy Prompts</button></div><script>const LOCKED="LOCKED CHARACTERS - NEVER CHANGE FACES: Diabolooon monkey RED cap, Bello elephant BLUE shirt, Luna rabbit PINK dress, Tico turtle GREEN glasses, Sky parrot YELLOW BLUE - SAME face every scene,";let generatedImages=[],videoBlobUrl=null;function makePrompts(idea,style){return[`Scene1 Wake ${LOCKED} ${idea} morning wake surprised 3D Pixar bright`,`Scene2 Problem ${LOCKED} ${idea} broken bridge worried 3D Pixar`,`Scene3 Planning ${LOCKED} ${idea} teamwork plan closeup 3D Pixar`,`Scene4 Fixing ${LOCKED} ${idea} fixing bridge working 3D Pixar`,`Scene5 Celebration ${LOCKED} ${idea} celebration treasure confetti 3D Pixar`]}async function generateAll(){const idea=document.getElementById('idea').value;const prompts=makePrompts(idea);document.getElementById('scenes').innerHTML='';generatedImages=[];document.getElementById('genBtn').disabled=true;for(let i=0;i<prompts.length;i++){const p=prompts[i];const div=document.createElement('div');div.className='scene';div.innerHTML=`<div style="padding:8px"><span class="badge">SCENE ${i+1}</span><div style="font-size:11px;color:#bbb">${p.slice(0,140)}</div></div><img id="img${i}"><div id="meta${i}" style="padding:8px;font-size:11px">⏳ Generating...</div>`;document.getElementById('scenes').appendChild(div);const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=768&seed=${100+i*13}&nologo=true`;document.getElementById(`img${i}`).src=url;await new Promise(r=>{document.getElementById(`img${i}`).onload=r;document.getElementById(`img${i}`).onerror=r;setTimeout(r,4000)});document.getElementById(`meta${i}`).textContent='✅ Done - Tap to regenerate';generatedImages[i]=url;document.getElementById(`img${i}`).onclick=()=>{const u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+' '+Math.random())}?width=1024&height=768&seed=${Math.floor(Math.random()*9999)}`;document.getElementById(`img${i}`).src=u;generatedImages[i]=u};document.getElementById('bar').style.width=((i+1)/5*100)+'%'}document.getElementById('status').textContent='✅ Images ready! Building video...';document.getElementById('genBtn').disabled=false;buildSlideshow()}function copyAll(){const idea=document.getElementById('idea').value;navigator.clipboard.writeText(makePrompts(idea).join('\n\n'));alert('Copied!')}async function buildSlideshow(){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=768;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(24);const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});let chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});videoBlobUrl=URL.createObjectURL(blob);document.getElementById('status').textContent='✅ VIDEO READY! Tap Download Video'};recorder.start();for(let idx=0;idx<generatedImages.length;idx++){const img=new Image();img.crossOrigin='anonymous';img.src=generatedImages[idx];await new Promise(r=>{img.onload=r;img.onerror=r;setTimeout(r,2000)});for(let f=0;f<72;f++){ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,canvas.height-60,canvas.width,60);ctx.fillStyle='white';ctx.font='bold 22px sans-serif';ctx.fillText(`DIABLOOON Scene ${idx+1}`,20,canvas.height-20);await new Promise(r=>setTimeout(r,1000/24))}}recorder.stop()}function downloadVideo(){if(!videoBlobUrl){alert('Video building, wait 20 sec...');return}const a=document.createElement('a');a.href=videoBlobUrl;a.download='DIABLOOON-video.webm';a.click()}</script></body></html>
